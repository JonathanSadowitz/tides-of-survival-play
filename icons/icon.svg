<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Tides of Survival: an Alliance sword and a Horde axe crossed over a breaking wave. Original art. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1d4f86"/><stop offset="1" stop-color="#071830"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a9ad6"/><stop offset="1" stop-color="#0c3f6e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f8fb"/><stop offset="0.5" stop-color="#c9d3dc"/><stop offset="1" stop-color="#7d8b98"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c0c6"/><stop offset="1" stop-color="#5b6570"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe089"/><stop offset="1" stop-color="#c58b1f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a2b"/><stop offset="1" stop-color="#4e2f14"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- the breaking wave -->
  <path d="M0 300 C70 250 150 236 222 278 C268 305 320 318 356 288 C392 258 380 214 336 214 C404 168 486 206 512 282 L512 512 L0 512 Z" fill="url(#sea)"/>
  <path d="M0 300 C70 250 150 236 222 278 C268 305 320 318 356 288 C392 258 380 214 336 214 C404 168 486 206 512 282" fill="none" stroke="#e9f6ff" stroke-width="18" stroke-linecap="round"/>
  <path d="M0 404 C110 366 214 424 330 392 C420 368 470 380 512 398 L512 512 L0 512 Z" fill="#0b3a66"/>
  <path d="M0 404 C110 366 214 424 330 392 C420 368 470 380 512 398" fill="none" stroke="#9fd4f5" stroke-width="9" stroke-linecap="round"/>
  <g stroke="#08101a" stroke-width="9" stroke-linejoin="round">
    <!-- the Horde axe, leaning left -->
    <g transform="rotate(-38 256 270)">
      <rect x="238" y="96" width="36" height="352" rx="12" fill="url(#wood)"/>
      <rect x="232" y="420" width="48" height="34" rx="10" fill="url(#gold)"/>
      <path d="M246 112 L164 78 C124 138 124 204 164 262 L246 228 Z" fill="url(#dark)"/>
      <path d="M164 78 C124 138 124 204 164 262" fill="none" stroke="#ffe089" stroke-width="10"/>
    </g>
    <!-- the Alliance sword, leaning right -->
    <g transform="rotate(38 256 270)">
      <path d="M256 40 L286 96 L286 326 L226 326 L226 96 Z" fill="url(#steel)"/>
      <path d="M256 92 L256 316" stroke="#7d8b98" stroke-width="7"/>
      <rect x="170" y="322" width="172" height="34" rx="14" fill="url(#gold)"/>
      <rect x="238" y="356" width="36" height="72" rx="8" fill="#3b4f8c"/>
      <circle cx="256" cy="446" r="26" fill="url(#gold)"/>
    </g>
  </g>
</svg>
