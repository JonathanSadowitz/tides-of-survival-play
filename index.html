  @media (max-width:760px){#labMain{flex-direction:column}#labSide{width:auto;border-left:0;border-top:2px solid var(--gold2);max-height:52vh}}
  @media (max-height:520px){ .panel.scrolls .sheet{overflow:auto;overscroll-behavior:contain} .panel.scrolls .sheet .items{max-height:none;overflow:visible} }   /* phones on their side: the whole sheet scrolls */
  @media (max-width:600px){   /* narrow (phone upright): one column */
    .sheet{grid-template-columns:1fr} .sheet .items{grid-column:1;grid-row:auto;max-height:none}

    .panel.scrolls{max-height:none} .panel.scrolls .scrollbox{overflow:visible}
  }

  const bt = Core.decrypt(u32s(await rd(base + h[5], base + h[5] + h[7] * 16), h[7] * 4), Core.hashStr('(block table)', 3));

    const n = h[6], a = Core.hashStr(name, 1), b = Core.hashStr(name, 2); let i = Core.hashStr(name, 0) % n;

    const buf = (await rd(base + b.pos, base + b.pos + b.csize)).buffer;
    await DB.putMusic({ name: id, buf, b, sectorSize }); mu.names.add(id); found++;

}
