# Uploads the game to itch.io whenever a new version is published here.
#
# One-time setup: on GitHub, repository Settings → Secrets and variables → Actions → Secrets, add
# BUTLER_API_KEY = an itch.io API key (itch.io → Settings → API keys). Without it, the run fails with a message saying so.
# The game it uploads to is https://captmurdock.itch.io/tides-of-survival.
name: Upload to itch.io
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  itch:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_GAME: captmurdock/tides-of-survival
    steps:
      - uses: actions/checkout@v4
      - name: Check setup
        id: setup
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "::error::No BUTLER_API_KEY repository secret, so nothing was uploaded to itch.io."; exit 1; fi; echo "ready=yes" >> "$GITHUB_OUTPUT"
      - name: Build the upload
        if: steps.setup.outputs.ready == 'yes'
        run: mkdir build && cp -r index.html sw.js manifest.webmanifest icons pack build/   # the game and its asset pack (the shareware folder went in 0.21.0)
      - name: Install butler
        if: steps.setup.outputs.ready == 'yes'
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler && ./butler/butler -V
      - name: Push to itch.io
        if: steps.setup.outputs.ready == 'yes'
        run: ./butler/butler push build "$ITCH_GAME:html" --userversion "$(git rev-parse --short HEAD)"
